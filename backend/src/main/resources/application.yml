spring:
  application:
    name: finflow
  config:
    # Lets `cp .env.example .env` drive both docker compose and the backend.
    # Real environment variables still take precedence.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/finflow}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true
  autoconfigure:
    # Authentication is API-key based; no default in-memory user/password should be generated.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  # Public on purpose: the API docs are part of the portfolio demo.
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method

logging:
  pattern:
    level: "%5p [req=%X{requestId:-}]"
  level:
    com.finflow: INFO

finflow:
  cors:
    allowed-origins: ${FINFLOW_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  demo:
    enabled: ${FINFLOW_DEMO_ENABLED:true}
    seed: ${FINFLOW_DEMO_SEED:true}
    api-key: ${FINFLOW_DEMO_API_KEY:}
  simulator:
    latency-ms: ${FINFLOW_SIMULATOR_LATENCY_MS:120}
    timeout-ms: ${FINFLOW_SIMULATOR_TIMEOUT_MS:1500}
    outage: ${FINFLOW_SIMULATOR_OUTAGE:false}
  refunds:
    window-days: ${FINFLOW_REFUND_WINDOW_DAYS:180}
