# FinFlow local environment. Values come from .env (copy .env.example); compose reads it.
#
#   docker compose up -d                              # PostgreSQL, Kafka, Redis (backend/frontend run on the host)
#   docker compose --profile app up -d --build        # + backend and frontend containers: http://localhost:8081
#   docker compose --profile monitoring up -d         # + Prometheus, Grafana, Jaeger
#
# Host ports avoid common clashes with locally installed services (5433, 6380).
services:
  postgres:
    image: postgres:17-alpine
    container_name: finflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finflow}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - finflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-node KRaft broker (no ZooKeeper). Two listeners: EXTERNAL for a backend running on the
  # host (localhost:9092), INTERNAL for containers on the compose network (kafka:29092).
  kafka:
    image: apache/kafka-native:4.2.2
    container_name: finflow-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    volumes:
      - finflow-kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Rate limiting and short-lived caches only; data loss here never affects financial records.
  redis:
    image: redis:8.6-alpine
    container_name: finflow-redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb",
              "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: ["app"]
    build: ./backend
    image: finflow-backend:local
    container_name: finflow-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-finflow}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: 15
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379
      FINFLOW_CORS_ALLOWED_ORIGINS: http://localhost:8081
      # Only reachable through the frontend's nginx, which overwrites X-Forwarded-For.
      FINFLOW_FORWARD_HEADERS_STRATEGY: framework
      FINFLOW_OPS_TOKEN: ${FINFLOW_OPS_TOKEN:-}
      FINFLOW_DEMO_API_KEY: ${FINFLOW_DEMO_API_KEY:-}
      FINFLOW_DEMO_RESET_CRON: ${FINFLOW_DEMO_RESET_CRON:--}
      FINFLOW_TRACING_EXPORT_ENABLED: ${FINFLOW_TRACING_EXPORT_ENABLED:-false}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "2", memory: 768M }
    restart: unless-stopped

  frontend:
    profiles: ["app"]
    build: ./frontend
    image: finflow-frontend:local
    container_name: finflow-frontend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "8081:8080"
    depends_on:
      backend: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 64M }
    restart: unless-stopped

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.15.1
    container_name: finflow-prometheus
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:13.2.4
    container_name: finflow-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-local-only}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # Receives OTLP traces from the backend (FINFLOW_TRACING_EXPORT_ENABLED=true); UI on :16686.
  jaeger:
    profiles: ["monitoring"]
    image: jaegertracing/jaeger:2.22.0
    container_name: finflow-jaeger
    ports:
      - "16686:16686"
      - "4318:4318"

volumes:
  finflow-pgdata:
  finflow-kafka:
