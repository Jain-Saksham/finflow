# Local infrastructure for FinFlow. Phase 1 needs only PostgreSQL.
# Values come from .env (copy .env.example); compose reads it automatically.
services:
  postgres:
    image: postgres:17-alpine
    container_name: finflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finflow}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      # 5433 on the host avoids clashing with a locally installed PostgreSQL on 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - finflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  finflow-pgdata:
